# Run everything: docker compose up --build
#   frontend http://localhost:8080   backend http://localhost:8000
# Needs SECRET_KEY in your shell or in a .env file next to this one (see .env.example).

services:
  backend:
    build: ./backend
    # Seed the demo data only when the database is empty, then start the API.
    command: sh -c "python -m app.seed --if-empty && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: production
      # Stops with this message if SECRET_KEY is missing. Never hardcode it here.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set. Copy .env.example to .env and fill it in.}
      DATABASE_URL: sqlite:////data/aipulse.db
      CORS_ORIGINS: http://localhost:8080   # must match where the frontend is served
      AI_MODE: ${AI_MODE:-mock}
      # Live AI with Ollama running on your machine (outside Docker). Set AI_MODE=live in .env too.
      # LLM_API_URL: http://host.docker.internal:11434/v1/chat/completions
      # LLM_API_KEY: ollama
      # LLM_MODEL: llama3.2
      # LLM_JSON_MODE: "true"
    # extra_hosts:                            # needed on Linux for host.docker.internal
    #   - "host.docker.internal:host-gateway"
    volumes:
      - aipulse-data:/data   # the SQLite file survives restarts and rebuilds
    ports:
      - "8000:8000"
    healthcheck:
      # The slim Python image has no curl, so use Python itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls this address, so it is the host port, not the container name.
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aipulse-data:
